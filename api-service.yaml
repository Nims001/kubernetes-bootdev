apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: synergychat-api
  ports: # we need one array entry using 1 - that specifies protocol, port,targetPort and nodeport i.e port in our computer where outside world can send request to access the api
    - protocol: TCP
      port: 80
      targetPort: 8080
      
    
